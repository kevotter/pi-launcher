<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src ipc: http://ipc.localhost; base-uri 'none'; form-action 'none'">
  <meta name="color-scheme" content="light">
  <title>Pi Launcher</title>
  <style>
    /* Startup screen. Deliberately light in every Windows theme: the artwork is
       a fixed illustration, and the native window background uses the same
       paper colour so the first frame matches it instead of flashing. */
    :root {
      color-scheme: light;
      --ink: #3a2f38;
      --paper: #fdf3f1;
    }

    /* ---------- 内嵌字体 ---------- */
    /* 子集只含动画用到的 16 个码位（含空格），每个字重约 2.6 KB；由
       scripts/build-startup-font.py 从思源宋体切出并改名（OFL 的保留字体名不能沿用）。
       带上它是为了让没装宋体的机器也长成一样，系统字体只能作为兜底。
       font-display: block——本地文件毫秒级加载，宁可等一帧也不要看到字体跳变。 */
    @font-face {
      font-family: "Ciallo Serif";
      src: url("./fonts/ciallo-700.woff2") format("woff2");
      font-weight: 700;
      font-style: normal;
      font-display: block;
    }

    @font-face {
      font-family: "Ciallo Serif";
      src: url("./fonts/ciallo-800.woff2") format("woff2");
      font-weight: 800;
      font-style: normal;
      font-display: block;
    }

    * { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--paper);
      color: var(--ink);
      /* Serif (宋体一类) — 思源宋体优先，Windows 上退到自带的 SimSun */
      font-family: "Source Han Serif SC", "Noto Serif CJK SC", "Songti SC", SimSun, "宋体", serif;
      -webkit-tap-highlight-color: transparent;
      -webkit-font-smoothing: antialiased;
      user-select: none;
      -webkit-user-select: none;
      cursor: default;
      touch-action: manipulation;
    }

    /* 背景：暖白 + 淡粉光晕 */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 18% 12%, rgba(255, 208, 214, .8), transparent 52%),
        radial-gradient(circle at 84% 82%, rgba(255, 226, 196, .75), transparent 55%),
        radial-gradient(circle at 62% 8%, rgba(226, 214, 255, .45), transparent 45%),
        linear-gradient(160deg, #fffaf7 0%, #fdeef0 55%, #fbe8e4 100%);
      z-index: 0;
    }

    /* 极细网点，避免大面积浅色发糊 */
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      background-image: radial-gradient(rgba(58, 47, 56, .07) 1px, transparent 1px);
      background-size: 22px 22px;
      opacity: .45;
      pointer-events: none;
      z-index: 0;
    }

    /* ---------- 滚动弹幕 ---------- */
    .stage {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      overflow: hidden;
    }

    .track {
      position: absolute;
      left: 0;
      right: 0;
      overflow: hidden;
      line-height: 1;
    }

    .ciallo {
      position: absolute;
      left: 100%;
      white-space: nowrap;
      font-family: "Ciallo Serif", "Source Han Serif SC", "Noto Serif CJK SC", "Songti SC", SimSun, "宋体", serif;
      font-weight: 700;
      letter-spacing: .01em;
      animation: slide var(--dur, 12s) linear infinite;
      will-change: transform;
    }

    @keyframes slide {
      from { transform: translate3d(0, 0, 0); }
      to   { transform: translate3d(calc(-100vw - 100%), 0, 0); }
    }

    /* 中间的柔光，让标题不跟弹幕抢像素 */
    .veil {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background: radial-gradient(ellipse 58% 26% at 50% 50%,
        rgba(253, 243, 241, .95) 0%,
        rgba(253, 243, 241, .8) 45%,
        rgba(253, 243, 241, 0) 100%);
    }

    /* ---------- 中央跳动标题 ---------- */
    .jumper {
      position: fixed;
      inset: 0;
      z-index: 3;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(1.9rem, 7.6vw, 5rem);
      font-family: "Ciallo Serif", "Source Han Serif SC", "Noto Serif CJK SC", "Songti SC", SimSun, "宋体", serif;
      font-weight: 800;
      pointer-events: none;
    }

    .jumper span {
      display: inline-block;
      position: relative;
      animation: bounce .3s ease infinite alternate;
      text-shadow:
        0 .04em 0 rgba(255, 255, 255, .95),
        0 .28em .5em rgba(196, 104, 118, .2);
      will-change: transform;
    }

    @keyframes bounce {
      from {
        transform: translate3d(0, 0, 0);
        text-shadow: 0 .04em 0 rgba(255, 255, 255, .95);
      }
      to {
        transform: translate3d(0, -.5em, 0);
        text-shadow:
          0 .04em 0 rgba(255, 255, 255, .95),
          0 .85em .38em rgba(196, 104, 118, .28);
      }
    }

    /* ---------- 启动失败 ---------- */
    /* The native message box is the primary channel, but it can be refused by
       policy and it disappears with the process. The reason and the log path
       stay on screen instead of sitting on a status line forever. */
    .failure {
      position: fixed;
      inset: 0;
      z-index: 6;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 48px;
      background: rgba(253, 243, 241, .92);
      backdrop-filter: blur(3px);
    }

    body[data-phase="failed"] .failure { display: flex; }
    /* Stop the show while something is being read. */
    body[data-phase="failed"] .stage,
    body[data-phase="failed"] .jumper,
    body[data-phase="failed"] .veil { display: none; }

    .failure h2 {
      margin: 0;
      font-size: clamp(1.4rem, 3.4vw, 2rem);
      font-weight: 800;
      letter-spacing: -.02em;
      color: #b4554a;
    }

    .subtitle {
      margin: 0;
      max-width: 42em;
      font-size: 13px;
      line-height: 1.8;
      text-align: center;
      color: rgba(58, 47, 56, .62);
    }

    .error-box {
      margin: 8px 0 0;
      padding: 12px 14px;
      width: min(100%, 760px);
      max-height: 46vh;
      overflow: auto;
      border: 1px solid rgba(58, 47, 56, .1);
      border-radius: 12px;
      background: rgba(255, 255, 255, .62);
      color: #3a2f38;
      font-family: "Cascadia Code", Consolas, monospace;
      font-size: 11.5px;
      line-height: 1.7;
      text-align: left;
      white-space: pre-wrap;
      word-break: break-word;
      user-select: text;
      -webkit-user-select: text;
      cursor: text;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; }
    }
  </style>
</head>
<body data-phase="environment">

<div class="stage" id="stage" aria-hidden="true"></div>

<div class="veil" aria-hidden="true"></div>

<h1 class="jumper" id="jumper" aria-label="Ciallo～(∠・ω&lt; )⌒★"></h1>

<section class="failure" aria-labelledby="heading">
  <h2 id="heading">启动失败</h2>
  <p class="subtitle" id="failure-hint">请检查配置或日志后重试。</p>
  <pre class="error-box" id="error-box" role="alert"></pre>
</section>

<script type="module" src="./loading.js"></script>
</body>
</html>
