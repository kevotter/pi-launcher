<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src ipc: http://ipc.localhost; base-uri 'none'; form-action 'none'">
  <meta name="color-scheme" content="light dark">
  <title>Pi Launcher</title>
  <style>
    /* Registered as an interpolable percentage: an unregistered custom
       property swaps discretely, so `width: var(--p)` could only jump between
       stages instead of sliding to the next one. */
    @property --p {
      syntax: "<percentage>";
      inherits: true;
      initial-value: 12%;
    }
    :root {
      color-scheme: light dark;
      --canvas: #f5f5f3;
      --surface: #ffffff;
      --ink: #24272d;
      --muted: #737780;
      --line: rgba(32, 36, 45, .075);
      --line-strong: rgba(32, 36, 45, .13);
      --grid: rgba(32, 36, 45, .035);
      --accent: #aa6253;
      --accent-soft: rgba(201, 119, 101, .10);
      --track: rgba(32, 36, 45, .075);
      --shadow: 0 1px 2px rgba(42, 47, 60, .045);
      --rim: rgba(255, 255, 255, .7);
      /* The bar is a solid block, so it casts as one: a hairline rim and the
         shallowest possible drop shadow. No halo — a pale glow on a white card
         has nothing to sit against and reads as a smudge around the rail. */
      --fill-shadow: 0 0 0 1px var(--rim), 0 1px 2px rgba(42, 47, 60, .10);
      /* The sweep that travels inside the bar. Symmetric and edge-free: on a 6px
         solid block a tight highlight reads as a chip out of the paint, so the
         pass has to be wide and soft to read as light running along it. */
      --flow-sweep: linear-gradient(
        90deg,
        rgba(255, 255, 255, 0) 0%,
        rgba(255, 255, 255, .10) 18%,
        rgba(255, 255, 255, .38) 52%,
        rgba(255, 255, 255, .10) 82%,
        rgba(255, 255, 255, 0) 100%
      );
      /* How far the rail has filled. Approximate on purpose: it never reaches
         100%, because the page is torn down the moment the workspace opens and
         a full bar before the navigation would be a lie. */
      --p: 12%;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 40px 24px;
      background: var(--canvas);
      color: var(--ink);
      font-family: "Segoe UI Variable", "Segoe UI", "Microsoft YaHei UI", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      transition: --p .8s cubic-bezier(.22, 1, .36, 1);
    }
    body[data-phase="environment"] { --p: 12%; }
    body[data-phase="backend"] { --p: 46%; }
    body[data-phase="workspace"] { --p: 79%; }
    /* Faint drafting grid instead of blurred colour orbs: the card sits on a
       work surface rather than floating in a gradient. Masked out at the edges
       so it reads as paper, not as wallpaper. */
    .ambient {
      position: fixed;
      inset: 0;
      z-index: -1;
      overflow: hidden;
      pointer-events: none;
      background-image:
        repeating-linear-gradient(to bottom, var(--grid) 0 1px, transparent 1px 26px),
        repeating-linear-gradient(to right, var(--grid) 0 1px, transparent 1px 26px);
      -webkit-mask-image: radial-gradient(ellipse 68% 58% at 50% 46%, #000 0%, transparent 100%);
      mask-image: radial-gradient(ellipse 68% 58% at 50% 46%, #000 0%, transparent 100%);
    }
    .shell { width: min(100%, 424px); animation: appear .5s ease-out both; }
    .brand { display: flex; align-items: baseline; gap: 10px; padding: 0 2px 18px; }
    .brand-name { font-size: 13px; font-weight: 600; letter-spacing: -.1px; }
    .phase-count {
      margin-left: auto;
      color: var(--muted);
      font-size: 10px;
      font-variant-numeric: tabular-nums;
      letter-spacing: .6px;
    }
    .phase-count::before { content: "01 / 03"; }
    body[data-phase="backend"] .phase-count::before { content: "02 / 03"; }
    body[data-phase="workspace"] .phase-count::before { content: "03 / 03"; }
    body[data-phase="failed"] .phase-count::before { content: "—"; }
    .card {
      padding: 34px 32px 26px;
      border: 1px solid var(--line-strong);
      border-radius: 14px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }
    .symbol {
      display: grid;
      place-items: center;
      width: 54px;
      height: 54px;
      margin-bottom: 24px;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: var(--accent-soft);
    }
    .symbol img { width: 38px; height: 38px; }
    h1 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -.4px; line-height: 1.45; }
    .subtitle { margin: 8px 0 26px; font-size: 12px; color: var(--muted); line-height: 1.75; }
    .status { display: flex; gap: 9px; align-items: center; font-size: 12px; }
    /* One breathing mark, not a spinning ring: the bar below already carries
       progress, so this only has to say "the process is alive". */
    .spinner {
      width: 6px;
      height: 6px;
      flex: 0 0 auto;
      border-radius: 1.5px;
      background: var(--accent);
      animation: pulse 2.4s ease-in-out infinite;
    }
    .track {
      position: relative;
      height: 6px;
      margin-top: 14px;
      border-radius: 3px;
      background: var(--track);
    }
    /* Two independent things to say, so two layers. The fill says *which*
       stage; the sweep says *still working*. They have to stay separate:
       `environment` and `backend` are emitted microseconds apart before the page
       even parses, then the health check holds one stage for seconds, so a fill
       alone sits frozen for most of the visible wait. */
    .fill {
      position: absolute;
      inset: 0 auto 0 0;
      z-index: 1;
      width: var(--p);
      border-radius: 3px;
      background: var(--accent);
      /* Whatever the bar casts belongs to the filled part, never to the rail:
         light around the empty track would claim the whole run is lit while most
         of it is still ahead. */
      box-shadow: var(--fill-shadow);
      overflow: hidden;
    }
    /* A light that travels *inside* the bar rather than sitting on it. This is
       the only shape a highlight can take on a 6px solid block: anything small
       and bright reads as a chip knocked out of the paint, anything round reads
       as a bead stuck on the end. Wide, symmetric and low-contrast, it reads the
       way light does when it runs along a solid edge — which is also why nothing
       moves ahead of it: the sweep passes, then the bar is simply the bar again.
       That gap is the point. An absent dot looks like a missing indicator; an
       absent sweep looks like nothing at all, because the bar never stopped. */
    .flow {
      position: absolute;
      top: 0;
      bottom: 0;
      left: -36%;
      width: clamp(14px, 34%, 72px);
      background: var(--flow-sweep);
      animation: flow 1.6s linear infinite;
    }
    /* Thirds, matching the three stages the list below names. */
    .steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 20px 0 0; padding: 0; list-style: none; }
    .step { display: flex; gap: 7px; align-items: center; color: var(--muted); font-size: 11px; }
    .step-dot {
      display: grid;
      place-items: center;
      width: 14px;
      height: 14px;
      border: 1px solid var(--line-strong);
      border-radius: 4px;
      font-size: 9px;
      font-variant-numeric: tabular-nums;
      transition: background-color .3s ease, border-color .3s ease, color .3s ease;
    }
    body[data-phase="environment"] [data-step="environment"],
    body[data-phase="backend"] [data-step="backend"],
    body[data-phase="workspace"] [data-step="workspace"] { color: var(--ink); }
    body[data-phase="environment"] [data-step="environment"] .step-dot,
    body[data-phase="backend"] [data-step="backend"] .step-dot,
    body[data-phase="workspace"] [data-step="workspace"] .step-dot { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
    body[data-phase="backend"] [data-step="environment"] .step-dot,
    body[data-phase="workspace"] [data-step="environment"] .step-dot,
    body[data-phase="workspace"] [data-step="backend"] .step-dot { color: var(--accent); background: var(--accent-soft); border-color: transparent; font-size: 0; }
    body[data-phase="backend"] [data-step="environment"] .step-dot::after,
    body[data-phase="workspace"] [data-step="environment"] .step-dot::after,
    body[data-phase="workspace"] [data-step="backend"] .step-dot::after { content: "✓"; font-size: 10px; }
    .footer { display: flex; justify-content: center; align-items: center; gap: 7px; margin-top: 20px; color: var(--muted); font-size: 10px; letter-spacing: .15px; }
    .footer svg { width: 12px; height: 12px; opacity: .7; }
    .divider { margin: 0 3px; opacity: .45; }
    .endpoint { font-family: "Cascadia Code", Consolas, monospace; font-size: 10px; font-variant-numeric: tabular-nums; }
    /* Startup failure: the message box may be refused by policy, so the reason
       and the log path stay on screen instead. */
    .error-box {
      margin: 18px 0 0;
      padding: 12px 14px;
      max-height: 220px;
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--track);
      color: var(--ink);
      font-family: "Cascadia Code", Consolas, monospace;
      font-size: 11px;
      line-height: 1.65;
      text-align: left;
      white-space: pre-wrap;
      word-break: break-word;
    }
    /* A failure stops the show: the spinner would keep implying progress that
       is never coming, so the status line and the progress list both go. */
    body[data-phase="failed"] .status,
    body[data-phase="failed"] .track,
    body[data-phase="failed"] .steps { display: none; }
    body[data-phase="failed"] .symbol { opacity: .45; border-color: var(--line); }
    /* The failure heading carries the same weight as "starting up" otherwise;
       recolor it so the state is readable before the text is. */
    body[data-phase="failed"] h1 { color: var(--accent); }
    body[data-phase="failed"] .error-box { border-left: 2px solid var(--accent); }
    @keyframes pulse {
      0%, 100% { opacity: .3; transform: scale(.8); }
      50% { opacity: 1; transform: scale(1); }
    }
    /* Percentages resolve against the fill, not the rail, so the sweep is always
       bounded by the progress itself and can never run past the end of it. Both
       ends of the lap happen fully outside the fill's clip, which is what hides
       the restart: the light never appears to jump back to the beginning. */
    @keyframes flow {
      from { left: -36%; }
      to { left: 100%; }
    }
    @keyframes appear { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    @media (prefers-color-scheme: dark) {
      :root {
        --canvas: #141518;
        --surface: #1a1b1f;
        --ink: #ededef;
        --muted: #9295a0;
        --line: rgba(255, 255, 255, .07);
        --line-strong: rgba(255, 255, 255, .12);
        --grid: rgba(255, 255, 255, .02);
        --accent: #e1a18c;
        --accent-soft: rgba(225, 161, 140, .09);
        --track: rgba(255, 255, 255, .085);
        --shadow: 0 1px 2px rgba(0, 0, 0, .3);
        --rim: rgba(255, 255, 255, .22);
        --fill-shadow: 0 0 0 1px var(--rim);
        /* The bar is pale here, so the sweep needs more white before it shows at
           all; the same values as light mode are almost invisible on #e1a18c. */
        --flow-sweep: linear-gradient(
          90deg,
          rgba(255, 255, 255, 0) 0%,
          rgba(255, 255, 255, .16) 18%,
          rgba(255, 255, 255, .58) 52%,
          rgba(255, 255, 255, .16) 82%,
          rgba(255, 255, 255, 0) 100%
        );
      }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; }
      .spinner { opacity: .85; transform: none; }
      /* Jump straight to the stage instead of easing into it. */
      body { transition: none; }
      /* A sweep frozen outside the fill is invisible, which reads as stalled;
         park it mid-fill so a still frame still says "in progress". */
      .flow { left: 26%; }
    }
    @media (max-width: 420px) {
      body { padding: 24px 18px; }
      .card { padding: 28px 22px 22px; }
      h1 { font-size: 18px; }
    }
  </style>
</head>
<body data-phase="environment">
  <div class="ambient" aria-hidden="true"></div>
  <main class="shell">
    <header class="brand">
      <span class="brand-name">Pi Launcher</span>
      <span class="phase-count" aria-hidden="true"></span>
    </header>
    <section class="card" aria-labelledby="heading" aria-busy="true">
      <div class="symbol" aria-hidden="true"><img src="./icon.svg?no-inline" alt=""></div>
      <h1 id="heading">正在准备工作空间</h1>
      <p class="subtitle">通常数秒即可完成，无需操作。</p>
      <div class="status" id="status-bar" role="status" aria-live="polite" aria-atomic="true">
        <span class="spinner" aria-hidden="true"></span>
        <span id="status-text">正在检查运行环境</span>
      </div>
      <div class="track" role="progressbar" aria-label="启动进度">
        <div class="fill"><span class="flow"></span></div>
      </div>
      <ol class="steps" aria-label="启动阶段">
        <li class="step" data-step="environment" aria-current="step"><span class="step-dot" aria-hidden="true">1</span>运行环境</li>
        <li class="step" data-step="backend"><span class="step-dot" aria-hidden="true">2</span>本地服务</li>
        <li class="step" data-step="workspace"><span class="step-dot" aria-hidden="true">3</span>工作空间</li>
      </ol>
      <pre class="error-box" id="error-box" hidden></pre>
    </section>
    <footer class="footer">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><rect x="2" y="2.5" width="12" height="8.5" rx="1.5"/><path d="M5.5 14h5M8 11v3"/></svg>
      <span>本地运行</span><span class="divider">·</span><span class="endpoint" id="endpoint">127.0.0.1</span>
    </footer>
  </main>
</body>
</html>
